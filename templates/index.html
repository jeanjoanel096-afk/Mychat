<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <title>Mychat Pro</title>
</head>
<body>
    <h1>Byenvini sou Mychat Pro!</h1>
    <div id="app-container">
        <p>Kont ou ap mache byen!</p>
        <div id="pwen-box">Pwen ou: <span id="pwen-valeur">0</span></div>
    </div>
</body>
</html>
<button onclick="ajePwen()">Gade Videyo (+10 Pwen)</button><script>
function ajePwen() {
    fetch('/gade-piblisite', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: "ProUser" })
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            document.getElementById('pwen-valeur').innerText = data.nouvo_balans;
        }
    });
}
</script>
