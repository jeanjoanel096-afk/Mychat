<!DOCTYPE html>
<html>
<body>
    <h1>Welcome to Mychat Pro!</h1>
    <p>Your account is going well!</p>
    
    <div>Your Point: <span id="pwen-valeur">0</span></div>
    
    <button onclick="ajePwen()">Watch video (+10 points)</button>

    <script>
        function ajePwen() {
            fetch('/gade-piblisite', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('pwen-valeur').innerText = data.nouvo_balans;
                }
            });
        }
    </script>
</body>
</html>
