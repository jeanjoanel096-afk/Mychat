<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyChat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans p-4">

    <div id="signup-screen" class="fixed inset-0 bg-gray-950 z-50 flex flex-col justify-center p-6">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-500">MyChat Sign Up</h1>
        <input type="text" id="username" placeholder="Non Itilizatè" class="w-full p-4 mb-4 bg-gray-800 rounded-xl border border-gray-700">
        <input type="email" id="email" placeholder="Imel" class="w-full p-4 mb-4 bg-gray-800 rounded-xl border border-gray-700">
        <input type="password" id="password" placeholder="Modpas" class="w-full p-6 mb-6 bg-gray-800 rounded-xl border border-gray-700">
        <button id="signup-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">Enskri Koulye a</button>
    </div>

    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold">MyChat Dashboard</h1>
    </div>

    <script>
        document.getElementById('signup-btn').addEventListener('click', function() {
            console.log("Bouton an klike!"); // Si ou wè sa nan console, script la mache
            const user = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if(user !== "" && email !== "" && pass !== "") {
                alert('Mèsi ' + user + '! Kont ou an anrejistre.');
                document.getElementById('signup-screen').style.display = 'none';
            } else {
                alert('Tanpri ranpli tout bwat yo!');
            }
        });
    </script>
</body>
</html>
