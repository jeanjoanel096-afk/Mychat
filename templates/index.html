<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <title>MyChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white font-sans">

    <!-- SIGN UP SCREEN -->
    <div id="signup-screen" class="fixed inset-0 bg-gray-950 z-50 flex flex-col justify-center p-6">
        <h1 class="text-3xl font-bold text-center text-blue-500 mb-8">MyChat</h1>
        <input type="text" id="username" placeholder="Non Itilizatè" class="w-full p-4 mb-4 bg-gray-800 rounded-xl text-white">
        <button id="signup-btn" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-white">Enskri</button>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-content" class="hidden">
        
        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="p-6">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">Dashboard</h2>
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                <p class="text-gray-300">Pousantaj: 100 pwen = 1$.</p>
                <button class="w-full bg-green-600 py-3 rounded-lg font-bold mt-4">Mande Retrè</button>
            </div>
        </div>

        <!-- STATUS TAB (Hidden by default) -->
        <div id="tab-status" class="p-6 hidden">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">Status</h2>
            <div class="bg-gray-800 p-4 rounded-xl text-center border border-gray-700">Ajoute yon nouvo status...</div>
        </div>

        <!-- CHAT TAB (Hidden by default) -->
        <div id="tab-chat" class="p-6 hidden">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">Chat</h2>
            <p>Lis moun yo...</p>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-800 flex justify-around p-4">
            <button onclick="showTab('dashboard')" class="text-blue-500 font-bold">Dashboard</button>
            <button onclick="showTab('status')" class="text-gray-400">Status</button>
            <button onclick="showTab('chat')" class="text-gray-400">Chat</button>
        </div>
    </div>

    <script>
        document.getElementById('signup-btn').addEventListener('click', () => {
            // Fòse montre app-content
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('app-content').style.display = 'block';
        });

        function showTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-status').classList.add('hidden');
            document.getElementById('tab-chat').classList.add('hidden');
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }
    </script>
</body>
</html>
